name: F-Droid release build

on:
  pull_request:
    paths:
      - '.github/workflows/fdroid-build.yml'
      - 'app/**'
      - 'data/**'
      - 'shader/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'fdroid/**'
      - 'fastlane/**'
      - 'LICENSE'
      - 'THIRD_PARTY.md'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build inputs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Check source-only runtime payload
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/l-wegert.frag
          grep -q 'hurwitz_zeta' app/src/main/assets/l-wegert.frag
          grep -q 'evaluate_chi3' app/src/main/assets/l-wegert.frag
          grep -q 'evaluate_chi4' app/src/main/assets/l-wegert.frag
          grep -q 'evaluate_chi5' app/src/main/assets/l-wegert.frag
          python3 -m json.tool data/dirichlet-l-neighbors.json > /dev/null
          grep -q 'android:hasCode="false"' app/src/main/AndroidManifest.xml
          if find app/src -type f \( -name '*.java' -o -name '*.kt' \) -print | grep -q .; then
            echo 'Java/Kotlin application source found'
            exit 1
          fi

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify F-Droid release output
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          unzip -t "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/l-release-files.txt"
          grep -Fxq lib/arm64-v8a/libl.so "$RUNNER_TEMP/l-release-files.txt"
          grep -Fxq lib/armeabi-v7a/libl.so "$RUNNER_TEMP/l-release-files.txt"
          grep -Fxq lib/x86_64/libl.so "$RUNNER_TEMP/l-release-files.txt"
          grep -Fq assets/l-wegert.frag "$RUNNER_TEMP/l-release-files.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/l-release-badging.txt"
          grep -Fq "package: name='org.isomorphisms.l' versionCode='1' versionName='0.1.0'" "$RUNNER_TEMP/l-release-badging.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: l-fdroid-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
